name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version from boot_it_meta.py, without leading v"
        required: true
        type: string
      final_release:
        description: "Publish as a final release instead of a prerelease"
        required: true
        default: false
        type: boolean

concurrency:
  group: boot-it-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release contract
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.contract.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate version, source ref, and commit identity
        id: contract
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          FINAL_RELEASE: ${{ inputs.final_release }}
        run: |
          args=(--version "$RELEASE_VERSION" --source-ref "$GITHUB_REF" --source-sha "$GITHUB_SHA" --output release-contract.json)
          if [ "$FINAL_RELEASE" = "true" ]; then
            args+=(--final)
          fi
          python scripts/release_contract.py "${args[@]}"
          echo "tag=v${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: boot-it-release-contract
          path: release-contract.json
          if-no-files-found: error

  build:
    name: ${{ matrix.os }} attested package
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Build GUI executable
        run: >-
          pyinstaller --clean --noconfirm --onefile --windowed --name Boot-It
          --hidden-import boot_it_runtime
          --hidden-import boot_it_auth_runtime
          --hidden-import boot_it_image
          --hidden-import boot_it_provenance
          --hidden-import boot_it_openpgp
          --hidden-import boot_it_publishers
          --hidden-import boot_it_publisher_runtime
          boot-it.py
      - name: Smoke, checksum, and manifest
        id: package
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            python scripts/package_artifact.py --binary dist/Boot-It.exe --output-dir release-artifacts
            binary="$(find release-artifacts -maxdepth 1 -type f -name 'Boot-It-*.exe' | head -n 1)"
          else
            python scripts/package_artifact.py --binary dist/Boot-It --output-dir release-artifacts
            binary="$(find release-artifacts -maxdepth 1 -type f -name 'Boot-It-*' ! -name '*.json' ! -name '*.sha256' | head -n 1)"
          fi
          test -n "$binary"
          sbom="${binary}.spdx.json"
          echo "binary=${binary}" >> "$GITHUB_OUTPUT"
          echo "sbom=${sbom}" >> "$GITHUB_OUTPUT"
      - name: Generate SPDX SBOM from frozen executable
        uses: anchore/sbom-action@v0.24.0
        with:
          file: ${{ steps.package.outputs.binary }}
          format: spdx-json
          output-file: ${{ steps.package.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false
      - name: Attest executable build provenance
        uses: actions/attest@v4.2.1
        with:
          subject-path: ${{ steps.package.outputs.binary }}
      - name: Attest executable SBOM
        uses: actions/attest@v4.2.1
        with:
          subject-path: ${{ steps.package.outputs.binary }}
          sbom-path: ${{ steps.package.outputs.sbom }}
      - uses: actions/upload-artifact@v4
        with:
          name: boot-it-release-${{ runner.os }}-${{ runner.arch }}
          path: release-artifacts/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: boot-it-release-*
          path: dist
          merge-multiple: true
      - name: Verify release bundle checksums
        shell: bash
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create immutable release payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          FINAL_RELEASE: ${{ inputs.final_release }}
        run: |
          flags=(--target "$GITHUB_SHA" --title "Boot It ${RELEASE_TAG}" --generate-notes)
          if [ "$FINAL_RELEASE" != "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* "${flags[@]}"
