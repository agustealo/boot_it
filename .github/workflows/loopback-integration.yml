name: Loopback Integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-loopback:
    name: Linux loopback destructive path
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      BOOT_IT_LOOPBACK_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 util-linux
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Verify loop-device support
        run: |
          sudo modprobe loop || true
          test -e /dev/loop-control
          sudo losetup --find
      - name: Run kernel-backed destructive-path tests
        run: sudo --preserve-env=QT_QPA_PLATFORM,BOOT_IT_LOOPBACK_TESTS env PATH="$PATH" python -m pytest -q tests/integration/test_linux_loopback.py
