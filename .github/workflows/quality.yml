name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt and OpenPGP runtime tooling
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 gnupg
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Compile
        run: >-
          python -m compileall -q
          boot_it.py boot-it.py boot_it_meta.py boot_it_models.py boot_it_macos.py
          boot_it_runtime.py boot_it_auth_runtime.py boot_it_image.py boot_it_provenance.py
          boot_it_openpgp.py boot_it_publishers.py boot_it_publisher_runtime.py
          boot_it_source.py boot_it_source_runtime.py boot_it_topology.py boot_it_topology_runtime.py
          scripts tests
      - name: Test
        run: python -m pytest -q

  platform-contract:
    name: Platform contract · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Compile cross-platform runtime
        run: >-
          python -m compileall -q
          boot_it.py boot-it.py boot_it_models.py boot_it_macos.py
          boot_it_source.py boot_it_source_runtime.py tests/test_core.py
          tests/test_macos_backend.py tests/test_entrypoint.py
      - name: Run cross-platform contract tests
        run: >-
          python -m pytest -q
          tests/test_core.py tests/test_macos_backend.py tests/test_entrypoint.py
