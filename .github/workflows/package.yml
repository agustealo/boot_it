name: Package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Build Linux/Windows GUI executable
        if: runner.os != 'macOS'
        run: >-
          pyinstaller --clean --noconfirm --onefile --windowed --name Boot-It
          --hidden-import boot_it_models
          --hidden-import boot_it_macos
          --hidden-import boot_it_runtime
          --hidden-import boot_it_auth_runtime
          --hidden-import boot_it_image
          --hidden-import boot_it_provenance
          --hidden-import boot_it_openpgp
          --hidden-import boot_it_publishers
          --hidden-import boot_it_publisher_runtime
          --hidden-import boot_it_source
          --hidden-import boot_it_source_runtime
          --hidden-import boot_it_topology
          --hidden-import boot_it_topology_runtime
          boot-it.py
      - name: Build macOS qualification app
        if: runner.os == 'macOS'
        run: >-
          pyinstaller --clean --noconfirm --onedir --windowed --name Boot-It
          --osx-bundle-identifier com.agustealo.bootit
          --hidden-import boot_it_models
          --hidden-import boot_it_macos
          --hidden-import boot_it_runtime
          --hidden-import boot_it_auth_runtime
          --hidden-import boot_it_image
          --hidden-import boot_it_provenance
          --hidden-import boot_it_openpgp
          --hidden-import boot_it_publishers
          --hidden-import boot_it_publisher_runtime
          --hidden-import boot_it_source
          --hidden-import boot_it_source_runtime
          --hidden-import boot_it_topology
          --hidden-import boot_it_topology_runtime
          boot-it.py
      - name: Smoke, checksum, and manifest
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            python scripts/package_artifact.py --binary dist/Boot-It.exe --output-dir release-artifacts
          elif [ "${RUNNER_OS}" = "macOS" ]; then
            python scripts/package_macos_app.py --app dist/Boot-It.app --output-dir release-artifacts
          else
            python scripts/package_artifact.py --binary dist/Boot-It --output-dir release-artifacts
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boot-it-${{ matrix.label }}
          path: release-artifacts/
          if-no-files-found: error
