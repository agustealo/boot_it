name: Package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Build GUI executable
        run: >-
          pyinstaller --clean --noconfirm --onefile --windowed --name Boot-It
          --hidden-import boot_it_runtime
          --hidden-import boot_it_auth_runtime
          --hidden-import boot_it_image
          --hidden-import boot_it_provenance
          --hidden-import boot_it_openpgp
          --hidden-import boot_it_publishers
          --hidden-import boot_it_publisher_runtime
          --hidden-import boot_it_source
          --hidden-import boot_it_source_runtime
          --hidden-import boot_it_topology
          --hidden-import boot_it_topology_runtime
          boot-it.py
      - name: Smoke, checksum, and manifest
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            python scripts/package_artifact.py --binary dist/Boot-It.exe --output-dir release-artifacts
          else
            python scripts/package_artifact.py --binary dist/Boot-It --output-dir release-artifacts
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: boot-it-${{ runner.os }}-${{ runner.arch }}
          path: release-artifacts/
          if-no-files-found: error
